<!doctype html>
<html lang="en" data-theme="{{ theme }}">
<head>
  <meta charset="utf-8">
  <title>claude-workbench</title>
  <link rel="stylesheet" href="/static/xterm.min.css">
  <link rel="stylesheet" href="/static/themes.css">
  <script src="/static/xterm.min.js"></script>
  <script src="/static/addon-fit.min.js"></script>
  <style>
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
      font-family: -apple-system, system-ui, sans-serif; }
    body { display: flex; flex-direction: column; }
    #tabs { display: flex; background: var(--chrome-bg); border-bottom: 1px solid var(--border);
      align-items: stretch; min-height: 32px; user-select: none; }
    .tab { display: flex; align-items: center; padding: 4px 8px 4px 12px;
      border-right: 1px solid var(--border); cursor: pointer; font-size: 13px; color: var(--muted); }
    .tab.active { background: var(--bg); color: var(--bright); }
    .tab .close { margin-left: 8px; padding: 0 4px; opacity: 0.6; }
    .tab .close:hover { opacity: 1; color: var(--danger); }
    #new-tab { padding: 4px 12px; cursor: pointer; color: var(--faint); font-size: 16px;
      align-self: center; }
    #new-tab:hover { color: var(--bright); }
    #tab-actions { margin-left: auto; display: flex; align-items: center; gap: 4px; padding-right: 6px; }
    #theme-picker { background: var(--input-bg); color: var(--btn-fg); border: 1px solid var(--border);
      border-radius: 3px; font-size: 12px; padding: 2px 4px; font-family: inherit; cursor: pointer; }
    #theme-picker:hover { color: var(--bright); border-color: var(--btn-border); }
    #theme-picker:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
    #panes { flex: 1; position: relative; }
    .pane { position: absolute; inset: 0; display: none; padding: 4px; box-sizing: border-box; }
    .pane.active { display: block; }
    .pane > .term { width: 100%; height: 100%; }
    .tab-menu { position:fixed; background:var(--menu-bg); border:1px solid var(--menu-border); border-radius:4px;
      z-index:1000; min-width:180px; box-shadow:0 4px 12px rgba(0,0,0,.5); overflow:hidden; }
    .tab-menu-item { padding:8px 14px; cursor:pointer; font-size:13px; color:var(--fg); white-space:nowrap; }
    .tab-menu-item:hover { background:var(--hover-bg); color:var(--bright); }
    .tab-menu-item.disabled { color:var(--menu-desc); cursor:default; pointer-events:none; }
    .tab-menu-desc { font-size:11px; color:var(--menu-desc); margin-top:1px; }
    .tab-menu-sep { height:1px; background:var(--menu-border); margin:4px 0; }
    .busy-overlay { position:absolute; inset:0; display:flex; flex-direction:column;
      align-items:center; justify-content:center; background:var(--overlay-bg);
      color:var(--overlay-fg); gap:20px; z-index:10; font-size:14px; }
    .busy-actions { display:flex; gap:12px; }
    .busy-btn { padding:6px 16px; border:1px solid var(--btn-border); background:var(--btn-bg); color:var(--btn-fg);
      cursor:pointer; border-radius:3px; font-size:13px; }
    .busy-btn:hover { background:var(--hover-bg); color:var(--bright); border-color:var(--muted); }
</style>
</head>
<body>
  <div id="tabs">
    <div id="new-tab" title="New terminal">+</div>
    <div id="tab-actions"></div>
  </div>
  <div id="panes"></div>
  <script src="/static/theme.js"></script>
  <script src="/static/app.js"></script>
  {% if side_panel_enabled %}<script src="/static/side-panel.js"></script>{% endif %}
</body>
</html>
