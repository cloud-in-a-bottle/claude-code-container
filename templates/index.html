<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>claude-workbench</title>
  <link rel="stylesheet" href="/static/xterm.min.css">
  <script src="/static/xterm.min.js"></script>
  <script src="/static/addon-fit.min.js"></script>
  <script src="/static/addon-clipboard.min.js"></script>
  <style>
    html, body { margin: 0; height: 100%; background: #1e1e1e; color: #ddd;
      font-family: -apple-system, system-ui, sans-serif; }
    body { display: flex; flex-direction: column; }
    #tabs { display: flex; background: #111; border-bottom: 1px solid #333;
      align-items: stretch; min-height: 32px; user-select: none; }
    .tab { display: flex; align-items: center; padding: 4px 8px 4px 12px;
      border-right: 1px solid #333; cursor: pointer; font-size: 13px; color: #aaa; }
    .tab.active { background: #1e1e1e; color: #fff; }
    .tab .close { margin-left: 8px; padding: 0 4px; opacity: 0.6; }
    .tab .close:hover { opacity: 1; color: #f55; }
    #new-tab { padding: 4px 12px; cursor: pointer; color: #888; font-size: 16px;
      align-self: center; }
    #new-tab:hover { color: #fff; }
    #panes { flex: 1; position: relative; }
    .pane { position: absolute; inset: 0; display: none; padding: 4px; box-sizing: border-box; }
    .pane.active { display: block; }
    .pane > .term { width: 100%; height: 100%; }
    .tab-menu { position:fixed; background:#222; border:1px solid #444; border-radius:4px;
      z-index:1000; min-width:180px; box-shadow:0 4px 12px rgba(0,0,0,.5); overflow:hidden; }
    .tab-menu-item { padding:8px 14px; cursor:pointer; font-size:13px; color:#ddd; white-space:nowrap; }
    .tab-menu-item:hover { background:#333; color:#fff; }
    .tab-menu-item.disabled { color:#666; cursor:default; pointer-events:none; }
    .tab-menu-sep { height:1px; background:#444; margin:4px 0; }
    .busy-overlay { position:absolute; inset:0; display:flex; flex-direction:column;
      align-items:center; justify-content:center; background:rgba(20,20,20,.92);
      color:#bbb; gap:20px; z-index:10; font-size:14px; }
    .busy-actions { display:flex; gap:12px; }
    .busy-btn { padding:6px 16px; border:1px solid #555; background:#2a2a2a; color:#ccc;
      cursor:pointer; border-radius:3px; font-size:13px; }
    .busy-btn:hover { background:#3a3a3a; color:#fff; border-color:#777; }
  </style>
</head>
<body>
  <div id="tabs">
    <div id="new-tab" title="New terminal">+</div>
  </div>
  <div id="panes"></div>
  <script src="/static/app.js"></script>
</body>
</html>
