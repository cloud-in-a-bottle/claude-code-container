[project]
name = "claude-workbench"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "attrs==26.1.0",
    "quart==0.20.0",
    "hypercorn==0.18.0",
    "httpx==0.28.1",
    "tomli-w==1.2.0",
]

[dependency-groups]
dev = [
    "mypy==1.16.0",
    "pre-commit==4.2.0",
    "pytest==9.0.3",
    "ruff==0.11.13",
]

[tool.ruff]
line-length = 119

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.14"
disallow_untyped_defs = true
disallow_any_generics = true
warn_return_any = true
warn_unused_ignores = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["test_open_workspace"]
warn_return_any = false
