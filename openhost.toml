[app]
name = "claude-workbench"
version = "0.1.0"
description = "Tabbed terminals preloaded with Claude Code and a cloned openhost repo, for building and debugging openhost apps."

[runtime.container]
image = "Dockerfile"
port = 5000

[routing]
health_check = "/health"
# The only publicly reachable path in this app. Linear delivers webhooks unauthenticated, so it
# cannot pass the router's owner login -- every other route stays owner-gated. The handler verifies
# Linear's HMAC signature over the raw body before it looks at the payload, and ignores deliveries
# whose timestamp is stale, so an unsigned or replayed POST is refused without doing any work.
public_paths = ["/api/linear/webhook"]

[resources]
memory_mb = 4096
cpu_cores = 1.0

# claude-workbench is the first provider of the open-workspace service: a valid
# repo + ref redirects the user into a checkout of that repo at that commit.
# The contract lives in this repo under services/open-workspace/.
[[services.v2.provides]]
service = "github.com/imbue-openhost/claude-code-container/services/open-workspace"
version = "0.1.0"
endpoint = "/open-workspace"

# Persistent home directory survives redeploys, so `claude login`, the openhost
# clone, shell history, etc. all stick around across updates. Mounted at
# /data/app_data/claude-workbench (env: OPENHOST_APP_DATA_DIR); entrypoint.sh
# repoints HOME there.
[data]
app_data = true

# Pull ANTHROPIC_API_KEY from the secrets app if it's installed. The fetch is
# best-effort — if secrets-v2 isn't around or the key isn't set, the terminal
# still works and the user can `claude login` or export the key by hand.
[[services.v2.consumes]]
service = "github.com/imbue-openhost/openhost/services/secrets"
shortname = "secrets"
version = ">=0.1.0"
grants = [
    {key = "ANTHROPIC_API_KEY"},
    {key = "OH_TOKEN"},
    # Linear's webhook signing secret. Inbound deliveries are the one thing latchkey can't broker,
    # since it injects credentials into outbound calls; without this the webhook refuses everything.
    {key = "LINEAR_WEBHOOK_SECRET"},
]

# Mint a transient GitHub token so open-workspace can clone private repos that
# openhost has access to (same OAuth flow openhost uses). Best-effort — public
# repos clone without it, and if no grant exists the clone falls back to
# unauthenticated.
[[services.v2.consumes]]
service = "github.com/imbue-openhost/openhost/services/oauth"
shortname = "oauth"
version = ">=0.1.0"
grants = [
    {provider = "github", scopes = ["repo"]},
]

# Linear is reached through latchkey, which injects the owner's credentials into outbound calls, so
# no Linear API key is ever stored in or visible to this app. `linear-api` is detent's built-in
# scope for api.linear.app; it has no finer-grained permission schemas, so the scope is the grant.
[[services.v2.consumes]]
service = "github.com/imbue-openhost/openhost-latchkey/services/latchkey"
shortname = "latchkey"
# 0.1.0 is enough: the only endpoint used here is `proxy/<url>`, which every version has. 0.2.0
# adds per-account credential status and account selection, and this app names no account, so
# there is nothing to gain by demanding it -- and a lower bound that some installed provider
# doesn't meet costs a 503 from the router before the call reaches latchkey at all.
version = ">=0.1.0"
grants = [
    {scope = "linear-api", permissions = []},
]
